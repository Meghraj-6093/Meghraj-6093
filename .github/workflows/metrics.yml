name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Render metrics
        uses: lowlighter/metrics@latest
        with:
          # A fine-grained PAT stored as METRICS_TOKEN gives access to deeper
          # plugins (languages, lines, community). Falls back to the default
          # token if no secret is configured yet.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          committer_branch: metrics
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_lines: yes
          base: header, activity, community, repositories, metadata
