name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure metrics branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan metrics
            git rm -rf . >/dev/null 2>&1 || true
            git commit --allow-empty -m "chore: bootstrap metrics branch"
            git push origin metrics
          fi

      - name: Render metrics
        uses: lowlighter/metrics@latest
        with:
          # A fine-grained PAT stored as METRICS_TOKEN gives access to deeper
          # plugins (languages, lines, community). Falls back to the default
          # token if no secret is configured yet.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          committer_branch: metrics
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_lines: yes
          base: header, activity, community, repositories, metadata
