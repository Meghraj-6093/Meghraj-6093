<svg width="1200" height="10" viewBox="0 0 1200 10" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="1200" height="2" fill="url(#dGrad)"/>
  <rect x="-260" y="3" width="260" height="4" fill="url(#shine)" opacity="0.7">
    <animate attributeName="x" values="-260;1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
