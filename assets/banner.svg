<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meghraj Ravani">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="55%" stop-color="#080b18"/>
      <stop offset="100%" stop-color="#0b0f20"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#0b0f20" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060d" stop-opacity="0.95"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#1e2a4a" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#vignette)"/>

  <rect x="0" y="0" width="1200" height="2" fill="url(#fade)" opacity="0.6">
    <animate attributeName="y" values="-10;330;-10" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.9">
    <circle cx="95" cy="70" r="2.2" fill="#38bdf8"><animate attributeName="cy" values="70;46;70" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;1;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="230" r="1.6" fill="#c084fc"><animate attributeName="cy" values="230;204;230" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="110" r="2" fill="#818cf8"><animate attributeName="cy" values="110;86;110" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="180" r="1.4" fill="#38bdf8"><animate attributeName="cx" values="60;80;60" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.8;0.15" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="80" r="2.4" fill="#c084fc"><animate attributeName="cy" values="80;54;80" dur="4.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="240" r="1.8" fill="#38bdf8"><animate attributeName="cy" values="240;214;240" dur="3.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="150" r="1.5" fill="#818cf8"><animate attributeName="cx" values="1150;1128;1150" dur="5.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="60" r="1.6" fill="#c084fc"><animate attributeName="cy" values="60;36;60" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="60" r="1.3" fill="#38bdf8"><animate attributeName="cy" values="60;80;60" dur="5.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="260" r="1.7" fill="#818cf8"><animate attributeName="cy" values="260;238;260" dur="4.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="4" fill="url(#text)" filter="url(#glow)">
    MEGHRAJ RAVANI
    <animate attributeName="opacity" values="0.88;1;0.88" dur="3.4s" repeatCount="indefinite"/>
  </text>

  <rect x="600" y="163" width="0" height="3" rx="1.5" fill="url(#text)" filter="url(#softGlow)">
    <animate attributeName="width" values="0;460;460;0" keyTimes="0;0.3;0.7;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;370;370;600" keyTimes="0;0.3;0.7;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="205" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="21" fill="#a7b4c8">
    Full-Stack Developer  ·  AI Engineer (Learning)  ·  Backend Developer
  </text>

  <text x="600" y="240" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" fill="#5b6b8c" letter-spacing="0.5">
    &gt; architecting HYPERION — a Multi-Agent AI Swarm
  </text>

  <g font-family="Consolas, monospace" font-size="13" fill="#3a4666">
    <text x="40" y="300">root@meghraj:~$ status</text>
    <text x="1030" y="300" text-anchor="end" fill="#2f7c74">● online</text>
  </g>
</svg>
